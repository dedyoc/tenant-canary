apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami # no namespace: the Application's destination supplies it
spec:
  replicas: 1
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
